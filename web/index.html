<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>1stPRTS (1prtsg) — First-Person Retro Space-Opera RTS</title>
  <style>
    html, body { margin: 0; padding: 0; background: #040814; color: #e2f1ff; font-family: monospace; overflow: hidden; height: 100%; }
    #canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    #toolbar { position: fixed; top: 8px; right: 12px; z-index: 10; display: flex; gap: 8px; }
    button { background: #0b1f3a; color: #52e3ff; border: 1px solid #35c2ff; padding: 6px 12px; font-family: monospace; cursor: pointer; }
    button:hover { background: #143663; }
    #status { position: fixed; bottom: 8px; left: 12px; z-index: 10; font-size: 12px; color: #ffd159; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-vr" disabled>Enter WebXR VR</button>
    <button id="btn-touch">Toggle Touch HUD</button>
  </div>
  <div id="status">Loading external assets from sibling folders (zero baked assets)...</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script src="xr_bridge.js"></script>
  <script>
    // Mount loose external assets/, scripts/, mods/, and config/ files from relative HTTP paths
    // into Emscripten MEMFS before invoking main() — zero baked assets in 1prtsg.wasm!
    async function syncExternalManifestToFS(Module) {
      const resp = await fetch('./manifest.json', { cache: 'no-store' });
      if (!resp.ok) throw new Error('Failed to fetch ./manifest.json');
      const manifest = await resp.json();
      const ensureDir = (dirPath) => {
        const parts = dirPath.split('/').filter(Boolean);
        let cur = '';
        for (const p of parts) {
          cur += '/' + p;
          try { Module.FS.mkdir(cur); } catch (_) {}
        }
      };
      for (const rel of manifest.files) {
        const r = await fetch('./' + rel, { cache: 'no-store' });
        if (!r.ok) throw new Error('Missing external file: ' + rel);
        const buf = new Uint8Array(await r.arrayBuffer());
        const slash = rel.lastIndexOf('/');
        if (slash > 0) ensureDir(rel.slice(0, slash));
        Module.FS.writeFile('/' + rel, buf);
      }
      document.getElementById('status').textContent =
        'Loaded ' + manifest.files.length + ' external loose files (76 unique constructs). L=Tactical Defense | M=Seamless RTS | 1-9=Showcases | F5/F9=Save/Load.';
    }

    var Module = {
      canvas: document.getElementById('canvas'),
      noInitialRun: true,
      onRuntimeInitialized: async function () {
        await syncExternalManifestToFS(Module);
        const isCoarse = window.matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0);
        if (Module._rts_web_notify_touch_device) {
          Module._rts_web_notify_touch_device(isCoarse ? 1 : 0);
        }
        window.initRtsWebXR(Module);
        Module.callMain(['--data-dir', '/']);
      }
    };
  </script>
  <script async src="1prtsg.js"></script>
</body>
</html>
